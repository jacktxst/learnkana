<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >

    <link rel="stylesheet" href="styles.css">

    <title>Kana Practice</title>

   
</head>

<body>

<div id="app">

    <div id="modeSelect">

        <h1>What are you learning today?</h1>

        <button id="hiraganaButton">
            Hiragana
        </button>

        <button id="katakanaButton">
            Katakana
        </button>

    </div>


    <div id="practice">

        <div id="kana"></div>

        <div id="feedback"></div>

        <div id="grid"></div>

        <button id="reveal">
            Reveal Answer
        </button>

        <div id="revealedAnswer"></div>

    </div>

</div>


<script>

/* =========================================================
   Kana data
   ========================================================= */

const hiragana = {
    あ: "a",
    い: "i",
    う: "u",
    え: "e",
    お: "o",

    か: "ka",
    き: "ki",
    く: "ku",
    け: "ke",
    こ: "ko",

    さ: "sa",
    し: "shi",
    す: "su",
    せ: "se",
    そ: "so",

    た: "ta",
    ち: "chi",
    つ: "tsu",
    て: "te",
    と: "to",

    な: "na",
    に: "ni",
    ぬ: "nu",
    ね: "ne",
    の: "no",

    は: "ha",
    ひ: "hi",
    ふ: "fu",
    へ: "he",
    ほ: "ho",

    ま: "ma",
    み: "mi",
    む: "mu",
    め: "me",
    も: "mo",

    や: "ya",
    ゆ: "yu",
    よ: "yo",

    ら: "ra",
    り: "ri",
    る: "ru",
    れ: "re",
    ろ: "ro",

    わ: "wa",
    を: "wo",

    ん: "n"
};


const katakana = {
    ア: "a",
    イ: "i",
    ウ: "u",
    エ: "e",
    オ: "o",

    カ: "ka",
    キ: "ki",
    ク: "ku",
    ケ: "ke",
    コ: "ko",

    サ: "sa",
    シ: "shi",
    ス: "su",
    セ: "se",
    ソ: "so",

    タ: "ta",
    チ: "chi",
    ツ: "tsu",
    テ: "te",
    ト: "to",

    ナ: "na",
    ニ: "ni",
    ヌ: "nu",
    ネ: "ne",
    ノ: "no",

    ハ: "ha",
    ヒ: "hi",
    フ: "fu",
    ヘ: "he",
    ホ: "ho",

    マ: "ma",
    ミ: "mi",
    ム: "mu",
    メ: "me",
    モ: "mo",

    ヤ: "ya",
    ユ: "yu",
    ヨ: "yo",

    ラ: "ra",
    リ: "ri",
    ル: "ru",
    レ: "re",
    ロ: "ro",

    ワ: "wa",
    ヲ: "wo",

    ン: "n"
};


/* =========================================================
   Gojūon grid
   ========================================================= */

const romajiGrid = [
    ["a",  "ka",  "sa",   "ta",   "na", "ha", "ma", "ya", "ra", "wa"],
    ["i",  "ki",  "shi",  "chi",  "ni", "hi", "mi", "",   "ri", ""  ],
    ["u",  "ku",  "su",   "tsu",  "nu", "fu", "mu", "yu", "ru", ""  ],
    ["e",  "ke",  "se",  "te",   "ne", "he", "me", "",   "re", ""  ],
    ["o",  "ko",  "so",   "to",   "no", "ho", "mo", "yo", "ro", "wo"]
];


/* =========================================================
   State
   ========================================================= */

let kanaData = null;
let currentKana = "";
let transitioning = false;


/* =========================================================
   DOM
   ========================================================= */

const modeSelect =
    document.getElementById("modeSelect");

const practice =
    document.getElementById("practice");

const kanaElement =
    document.getElementById("kana");

const feedbackElement =
    document.getElementById("feedback");

const gridElement =
    document.getElementById("grid");

const revealButton =
    document.getElementById("reveal");

const revealedAnswerElement =
    document.getElementById("revealedAnswer");

const hiraganaButton =
    document.getElementById("hiraganaButton");

const katakanaButton =
    document.getElementById("katakanaButton");


/* =========================================================
   Start selected mode
   ========================================================= */

hiraganaButton.addEventListener("click", () => {
    startPractice(hiragana);
});

katakanaButton.addEventListener("click", () => {
    startPractice(katakana);
});


function startPractice(data) {

    kanaData = data;

    modeSelect.style.display = "none";
    practice.style.display = "flex";

    buildGrid();

    newQuestion();
}


/* =========================================================
   Build the romaji grid
   ========================================================= */

function buildGrid() {

    gridElement.innerHTML = "";

    for (const row of romajiGrid) {

        for (const romaji of row) {

            const button =
                document.createElement("button");

            if (romaji === "") {

                button.className = "empty";
                button.disabled = true;

            } else {

                button.textContent = romaji;

                button.dataset.romaji = romaji;

                button.addEventListener(
                    "click",
                    () => chooseAnswer(button)
                );
            }

            gridElement.appendChild(button);
        }
    }
}


/* =========================================================
   Answer selection
   ========================================================= */

function chooseAnswer(button) {

    if (transitioning)
        return;

    const selected =
        button.dataset.romaji;

    const correct =
        kanaData[currentKana];


    if (selected === correct) {

        transitioning = true;

        button.classList.add("correct");

        feedbackElement.textContent =
            "✓ Correct!";

        revealButton.disabled = true;

        setTimeout(newQuestion, 600);

    } else {

        /*
         * Wrong buttons stay red.
         */

        button.classList.add("wrong");

        feedbackElement.textContent =
            "✗ Wrong!";
    }
}


/* =========================================================
   Reveal answer
   ========================================================= */

revealButton.addEventListener("click", () => {

    const correct =
        kanaData[currentKana];

    /*
     * Show the answer at the bottom,
     * but do NOT advance.
     */

    revealedAnswerElement.textContent =
        correct;

    revealButton.disabled = true;
});


/* =========================================================
   New question
   ========================================================= */

function newQuestion() {

    const characters =
        Object.keys(kanaData);

    currentKana =
        characters[
            Math.floor(Math.random() * characters.length)
        ];

    transitioning = false;

    kanaElement.textContent =
        currentKana;

    feedbackElement.textContent = "";

    revealedAnswerElement.textContent = "";

    revealButton.disabled = false;


    /*
     * Reset all button states.
     */

    gridElement
        .querySelectorAll("button")
        .forEach(button => {

            button.classList.remove("wrong");
            button.classList.remove("correct");
        });
}

</script>

</body>
</html>
